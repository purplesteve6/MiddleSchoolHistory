<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base target="_top">
  <title>Revolution Timeline</title>

  <style>
    html, body{ height:100%; margin:0; overflow:hidden; }

    :root{
      --bg:#081a3a;
      --bg2:#06122a;

      --text:#f7f3e6;
      --muted: rgba(247,243,230,.82);

      --gold:#FFD84A;
      --gold2:#f2c94c;
      --red:#b3122a;
      --red2:#7b0b1d;

      --panel: rgba(255,255,255,.055);
      --panel2: rgba(255,255,255,.032);

      --shadow: 0 14px 40px rgba(0,0,0,.45);
      --radius: 18px;
      --max: 980px;
      --focus: 0 0 0 4px rgba(255,216,74,.35);

      /* Geometry */
      --barsTop: 300px;
      --barTopInBars: 11px;
      --barH: 18px;

      --avatar: 104px;
      --gapToPortraitEdge: 112px;
      --stackGap: 10px;
      --metaH: 44px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(900px 700px at 0% 50%, rgba(179,18,42,.18), transparent 60%),
        radial-gradient(900px 700px at 100% 50%, rgba(255,216,74,.14), transparent 60%),
        linear-gradient(90deg, var(--bg2) 0%, var(--bg) 50%, var(--bg2) 100%);
      background-attachment: fixed;
      color:var(--text);
      line-height:1.5;
    }

    a{color:inherit}
    .tiny{font-size:.92rem; color: rgba(247,243,230,.72)}

    .wrap{ max-width: var(--max); margin: 0 auto; padding: 1rem 1rem 1.25rem; }

    .card{
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border:1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.1rem 1.1rem;
    }

    .timeline-head{
      display:flex; align-items:center; justify-content:flex-end;
      gap:1rem; flex-wrap:wrap; margin-bottom:.15rem;
    }

    .timeline-hint{
      margin-right:auto;
      font-weight:1000;
      font-size: 1.25rem;
      color: #fff;
      white-space: nowrap;
      display:flex; align-items:center;
    }

    .timeline-tip{
      margin-top:.25rem;
      margin-bottom:.5rem;
      text-align:center;
      font-size:1.0rem;
      color: rgba(255,255,255,.75);
      width:100%;
    }

    .timeline-controls{display:flex; gap:.55rem; flex-wrap:wrap; align-items:center}

    .controlPill{
      display:flex; align-items:center; gap:.5rem;
      padding:.35rem .55rem;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
    }
    .controlPill label{font-weight:1000; font-size:.9rem; color: rgba(247,243,230,.85); white-space:nowrap}
    .controlPill input[type="range"]{width: 150px}
    .controlPill select{
      color: var(--text);
      background: rgba(6,18,42,.45);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      padding: .35rem .6rem;
      font-weight:900;
      outline: none;
    }
    .controlPill select:focus{box-shadow:var(--focus)}

    .timelineViewport{
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background:
        radial-gradient(900px 260px at 20% 0%, rgba(179,18,42,.14), transparent 55%),
        radial-gradient(900px 260px at 80% 20%, rgba(255,216,74,.10), transparent 55%),
        rgba(6,18,42,.35);

      overflow-x: auto;
      overflow-y: hidden;

      scrollbar-width: none;
      -ms-overflow-style: none;

      height: 640px;
    }
    .timelineViewport::-webkit-scrollbar{ display:none; }

    .timelineCanvas{
      position:relative;
      height: 620px;
      min-width: 900px;
    }

    /* Ticks */
    .ticks{position:absolute; left:0; right:0; top: 18px; height: 66px; pointer-events:none}
    .tick{position:absolute; top:0; width:1px; background: rgba(255,255,255,.18)}
    .tick.month{height: 14px; top: 36px; opacity:.55}
    .tick.year{height: 38px; top: 10px; opacity:.9}

    .tickLabel{
      position:absolute; top: 0;
      transform: translateX(-50%);
      color: rgba(247,243,230,.78);
      font-weight:1000; font-size:.86rem;
      white-space:nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }

    /* Event markers (bubbles) */
    .marker{
      position:absolute; top:0; bottom:0; width:0;
      border-left: 2px dashed rgba(255,216,74,.55);
      opacity:.9;
      pointer-events:none;
    }

    .timelineLine{
      position:absolute;
      left:0; right:0;
      height:2px;
      background: rgba(255,255,255,.14);
      pointer-events:none;
    }

    .markerNote{
      position:absolute;
      transform: translateX(-50%);
      width: 280px;
      text-align:center;
      pointer-events:none;
    }

    .markerBubble{
      display:inline-block;
      padding:.22rem .62rem .3rem;
      border-radius: 999px;
      border:1px solid rgba(255,216,74,.40);
      background: rgba(179,18,42,.12);
      color: rgba(255,216,74,.95);
      font-weight:1000;
      letter-spacing:.2px;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
      line-height:1.1;
    }
    .markerBubble .t1{display:block; font-size:.92rem}
    .markerBubble .t2{display:block; margin-top:.18rem; font-size:.86rem; opacity:.95}

    /* Bars */
    .bars{position:absolute; left:0; right:0; top: var(--barsTop); height: 40px;}
    .bar{
      position:absolute; top: var(--barTopInBars); height: var(--barH);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 10px 24px rgba(0,0,0,.35);
      cursor:pointer;
      transition: transform .12s ease, filter .12s ease;
    }
    .bar:hover{transform: translateY(-1px); filter: brightness(1.06)}
    .bar:focus{outline:none; box-shadow: var(--focus)}
    .bar.is-active{
      outline: none;
      box-shadow: 0 0 0 4px rgba(255,216,74,.22), 0 10px 24px rgba(0,0,0,.35);
      border-color: rgba(255,216,74,.65);
    }

    /* Battle “cards” (alternating lanes) */
    .battle{
      position:absolute;
      transform: translateX(-50%);
      width: 210px;
      text-align:center;
      cursor:pointer;
      user-select:none;
      text-decoration:none;
      z-index: 3;
    }
    .battle:focus{outline:none; box-shadow: var(--focus); border-radius: 14px}

    .stack{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: var(--stackGap);
    }

    .avatarWrap{
      width: var(--avatar); height: var(--avatar);
      margin: 0 auto;
      border-radius: 22px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      box-shadow: 0 16px 34px rgba(0,0,0,.40);
    }
    .avatarWrap img{width:100%; height:100%; object-fit:cover; display:block}

    .meta{
      min-height: var(--metaH);
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      line-height:1.15;
    }
    .empName{font-weight:1000; letter-spacing:.2px}
    .empYears{color: rgba(247,243,230,.78); font-weight:900; font-size:.92rem; margin-top:.18rem}

    /* Connector (portrait -> timeline) */
    .connector{
      position:absolute;
      width:2px;
      left:50%;
      transform: translateX(-50%);
      background: rgba(255,216,74,.55);
      opacity:.95;
      border-radius: 99px;
      z-index: 2;
    }
    .connector::after{
      content:"";
      position:absolute;
      width:10px; height:10px;
      left:50%;
      transform: translateX(-50%);
      border-radius:50%;
      background: rgba(255,216,74,.95);
      box-shadow: 0 6px 18px rgba(0,0,0,.45);
      bottom:-5px;
    }
    .connector.dotTop::after{
      top:-5px;
      bottom:auto;
    }

    /* Mini-map */
    .scrubber{
      margin-top:.75rem;
      padding:.55rem .7rem;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      display:flex; align-items:center; gap:.8rem; flex-wrap:wrap;
    }
    .miniTrack{
      position:relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      flex: 1 1 320px;
      overflow:hidden;
    }
    .miniWindow{
      position:absolute; top:0; bottom:0;
      border-radius: 999px;
      background: rgba(255,216,74,.28);
      border: 1px solid rgba(255,216,74,.55);
      cursor:grab;
    }
    .miniWindow:active{cursor:grabbing}
  </style>
</head>

<body>
  <div class="wrap">
    <section class="card" aria-label="Timeline">
      <div class="timeline-head">
        <div class="timeline-hint">Scroll the Timeline</div>

        <div class="timeline-controls">
          <div class="controlPill" title="Zoom changes how much horizontal space each month takes">
            <label for="zoom">Zoom</label>
            <input id="zoom" type="range" min="30" max="140" step="5" value="70" />
            <span class="tiny" id="zoomVal">70 px/mo</span>
          </div>

          <div class="controlPill" title="Jump the timeline to a battle">
            <label for="centerSelect">Center on:</label>
            <select id="centerSelect" aria-label="Center timeline on a battle"></select>
          </div>
        </div>
      </div>

      <div class="timeline-tip">Tip: scroll sideways. Click a portrait or bar to open its page.</div>

      <div class="timelineViewport" id="viewport" tabindex="0" aria-label="Timeline viewport (scroll horizontally)">
        <div class="timelineCanvas" id="canvas"></div>
      </div>

      <div class="scrubber" aria-label="Timeline mini map scrubber">
        <div class="tiny" style="font-weight:900;">Mini-map</div>
        <div class="miniTrack" id="miniTrack">
          <div class="miniWindow" id="miniWindow" title="Drag to jump"></div>
        </div>
        <div class="tiny" id="yearReadout">Date: —</div>
      </div>
    </section>
  </div>

  <script>
    const timelineColors = ["#FFD84A","#B3122A","#F2C94C","#7B0B1D","#E9B949","#9E0F26"];

    // Optional highlight: timeline.html?active=long_island
    const activeId = (new URLSearchParams(location.search).get("active") || "").toLowerCase();

    // Range (monthly scaling)
    const range = {
      startISO: "1775-01-01",
      endISO:   "1783-12-31"
    };

    function parseUTC(iso){
      const [y,m,d] = iso.split("-").map(n=>parseInt(n,10));
      return new Date(Date.UTC(y, m-1, d));
    }

    const startDate = parseUTC(range.startISO);
    const endDate = parseUTC(range.endISO);

    // Month index from start (0 = Jan 1775), with a fraction through the month
    function dateToMonthFloat(iso){
      const dt = parseUTC(iso);
      const y = dt.getUTCFullYear();
      const m = dt.getUTCMonth(); // 0-11
      const startY = startDate.getUTCFullYear();
      const startM = startDate.getUTCMonth();
      const base = (y - startY) * 12 + (m - startM);

      const monthStart = new Date(Date.UTC(y, m, 1));
      const nextMonth = new Date(Date.UTC(y, m+1, 1));
      const frac = (dt - monthStart) / (nextMonth - monthStart);

      return base + frac;
    }

    const totalMonths = dateToMonthFloat(range.endISO);

    // Battles (Option B)
    const battles = [
      { id:"lexington_concord", name:"Lexington & Concord", startISO:"1775-04-19", endISO:"1775-04-20", display:"Apr 19, 1775", colorIndex:0, image:"./images/lexcon_timeline.webp", page:"./battles/lexington-concord.html" },
      { id:"bunker_hill", name:"Bunker Hill", startISO:"1775-06-17", endISO:"1775-06-18", display:"Jun 17, 1775", colorIndex:1, image:"./images/bunkerhill_timeline.webp", page:"./battles/bunker-hill.html" },
      { id:"ticonderoga", name:"Fort Ticonderoga (NY)", startISO:"1775-05-10", endISO:"1775-05-11", display:"May 10, 1775", colorIndex:2, image:"./images/ticonderoga_timeline.webp", page:"./battles/fort-ticonderoga.html" },

      { id:"long_island", name:"Long Island / Brooklyn (NY)", startISO:"1776-08-27", endISO:"1776-08-30", display:"Aug 27, 1776", colorIndex:3, image:"./images/longisland_timeline.webp", page:"./battles/long-island.html" },
      { id:"harlem_heights", name:"Harlem Heights (NY)", startISO:"1776-09-16", endISO:"1776-09-17", display:"Sep 16, 1776", colorIndex:4, image:"./images/harlemheights_timeline.webp", page:"./battles/harlem-heights.html" },

      { id:"trenton", name:"Trenton", startISO:"1776-12-26", endISO:"1776-12-27", display:"Dec 26, 1776", colorIndex:5, image:"./images/trenton_timeline.webp", page:"./battles/trenton.html" },

      { id:"saratoga", name:"Saratoga (NY)", startISO:"1777-09-19", endISO:"1777-10-17", display:"Sep–Oct 1777", colorIndex:0, image:"./images/saratoga_timeline.webp", page:"./battles/saratoga.html" },

      { id:"yorktown", name:"Yorktown", startISO:"1781-09-28", endISO:"1781-10-19", display:"Sep–Oct 1781", colorIndex:1, image:"./images/yorktown_timeline.webp", page:"./battles/yorktown.html" }
    ].map((b, i) => ({
      ...b,
      startM: dateToMonthFloat(b.startISO),
      endM: dateToMonthFloat(b.endISO),
      // Alternate lanes (Roman-style)
      lane: (i % 2 === 0) ? "above" : "below"
    }));

    // Event “bubbles” (also alternated top/bottom to avoid collisions)
    const events = [
      { id:"declaration", iso:"1776-07-04", top:"1776", bottom:"Declaration of Independence", lane:"above" },
      { id:"nyc_captured", iso:"1776-09-15", top:"1776", bottom:"British take New York City", lane:"below" },
      { id:"france_alliance", iso:"1778-02-06", top:"1778", bottom:"France becomes an ally", lane:"above" },
      { id:"treaty_paris", iso:"1783-09-03", top:"1783", bottom:"Treaty of Paris", lane:"below" }
    ].map(e => ({ ...e, xM: dateToMonthFloat(e.iso) }));

    const viewport = document.getElementById("viewport");
    const canvas = document.getElementById("canvas");
    const zoom = document.getElementById("zoom");
    const zoomVal = document.getElementById("zoomVal");
    const yearReadout = document.getElementById("yearReadout");
    const miniTrack = document.getElementById("miniTrack");
    const miniWindow = document.getElementById("miniWindow");
    const centerSelect = document.getElementById("centerSelect");

    let pxPerMonth = parseInt(zoom.value, 10);

    function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
    function xForMonth(tMonth){ return tMonth * pxPerMonth; }

    function populateDropdown(){
      centerSelect.innerHTML = "";
      const opt0 = document.createElement("option");
      opt0.value = "";
      opt0.textContent = "— Select —";
      centerSelect.appendChild(opt0);

      battles.forEach(b=>{
        const opt = document.createElement("option");
        opt.value = b.id;
        opt.textContent = b.name;
        centerSelect.appendChild(opt);
      });
    }

    function centerOn(id){
      const b = battles.find(x=>x.id===id);
      if(!b) return;
      const mid = (b.startM + b.endM) / 2;
      const targetX = xForMonth(mid) - (viewport.clientWidth/2);
      viewport.scrollLeft = clamp(targetX, 0, viewport.scrollWidth);
    }

    // --- Roman-style lane positioning helpers ---
    function getBarCenterY(){
      const cs = getComputedStyle(document.documentElement);
      const barsTop = parseFloat(cs.getPropertyValue("--barsTop"));
      const barTopInBars = parseFloat(cs.getPropertyValue("--barTopInBars"));
      const barH = parseFloat(cs.getPropertyValue("--barH"));
      return barsTop + barTopInBars + (barH/2);
    }

    function positionLanesSymmetrically(){
      const cs = getComputedStyle(document.documentElement);
      const gap = parseFloat(cs.getPropertyValue("--gapToPortraitEdge"));
      const avatarH = parseFloat(cs.getPropertyValue("--avatar"));
      const barCenterY = getBarCenterY();

      const sampleAbove = canvas.querySelector(".battle.laneAbove .avatarWrap");
      const sampleBelow = canvas.querySelector(".battle.laneBelow .avatarWrap");

      let aboveAvatarOffsetTop = 0;
      let belowAvatarOffsetTop = 0;

      if (sampleAbove) aboveAvatarOffsetTop = sampleAbove.offsetTop;
      if (sampleBelow) belowAvatarOffsetTop = sampleBelow.offsetTop;

      const aboveLaneTop = (barCenterY - gap) - (aboveAvatarOffsetTop + avatarH);
      const belowLaneTop = (barCenterY + gap) - (belowAvatarOffsetTop);

      canvas.querySelectorAll(".battle.laneAbove").forEach(el => el.style.top = aboveLaneTop + "px");
      canvas.querySelectorAll(".battle.laneBelow").forEach(el => el.style.top = belowLaneTop + "px");
    }

    function adjustConnectors(){
      const barCenterY = getBarCenterY();

      canvas.querySelectorAll(".battle").forEach(card => {
        const avatar = card.querySelector(".avatarWrap");
        const connector = card.querySelector(".connector");
        if (!avatar || !connector) return;

        const cardTop = card.offsetTop;
        const avatarTop = cardTop + avatar.offsetTop;
        const avatarBottom = avatarTop + avatar.offsetHeight;

        const isAbove = card.classList.contains("laneAbove");
        const portraitEdgeY = isAbove ? avatarBottom : avatarTop;

        const minY = Math.min(portraitEdgeY, barCenterY);
        const maxY = Math.max(portraitEdgeY, barCenterY);
        const height = Math.max(0, maxY - minY);

        connector.style.top = (minY - cardTop) + "px";
        connector.style.height = height + "px";
        connector.classList.toggle("dotTop", barCenterY === minY);
      });

      const line = canvas.querySelector(".timelineLine");
      if (line) line.style.top = barCenterY + "px";
    }

    // Ticks: monthly + year labels at January
    function renderTicks(){
      const tickWrap = document.createElement("div");
      tickWrap.className = "ticks";

      const startY = startDate.getUTCFullYear();
      const startM = startDate.getUTCMonth();

      // total months inclusive-ish
      const endY = endDate.getUTCFullYear();
      const endM = endDate.getUTCMonth();
      const count = (endY - startY) * 12 + (endM - startM) + 1;

      for(let idx=0; idx<count; idx++){
        const y = startY + Math.floor((startM + idx) / 12);
        const m = (startM + idx) % 12;

        const x = xForMonth(idx);

        const t = document.createElement("div");
        t.className = "tick " + (m === 0 ? "year" : "month");
        t.style.left = x + "px";
        tickWrap.appendChild(t);

        if (m === 0){
          const label = document.createElement("div");
          label.className = "tickLabel";
          label.style.left = x + "px";
          label.textContent = y.toString();
          tickWrap.appendChild(label);
        }
      }

      canvas.appendChild(tickWrap);
    }

    function render(){
      pxPerMonth = parseInt(zoom.value, 10);
      zoomVal.textContent = `${pxPerMonth} px/mo`;

      const w = Math.max(900, Math.ceil(totalMonths * pxPerMonth) + 220);
      canvas.style.width = w + "px";
      canvas.innerHTML = "";

      renderTicks();

      // timeline center line (positioned by adjustConnectors later, but give it a default)
      const line = document.createElement("div");
      line.className = "timelineLine";
      line.style.top = "245px";
      canvas.appendChild(line);

      // Event bubbles (alternate top/bottom)
      events.forEach((ev, i)=>{
        const x = xForMonth(ev.xM);

        const m = document.createElement("div");
        m.className = "marker";
        m.style.left = x + "px";
        canvas.appendChild(m);

        const note = document.createElement("div");
        note.className = "markerNote";
        note.style.left = x + "px";

        // Place above/below with stagger so they don’t collide
        if (ev.lane === "above"){
          note.style.top = (i % 2 === 0) ? "6px" : "56px";
        } else {
          // below: push near bottom area, still readable
          note.style.top = "520px";
        }

        note.innerHTML = `
          <span class="markerBubble">
            <span class="t1">${ev.top}</span>
            <span class="t2">${ev.bottom}</span>
          </span>
        `;
        canvas.appendChild(note);
      });

      // Bars layer
      const bars = document.createElement("div");
      bars.className = "bars";
      canvas.appendChild(bars);

      // Battles
      battles.forEach((b)=>{
        const leftX = xForMonth(b.startM);
        const rightX = xForMonth(b.endM);

        // bar
        const bar = document.createElement("a");
        bar.href = b.page;
        bar.className = "bar" + (activeId && activeId===b.id ? " is-active" : "");
        bar.setAttribute("role","link");
        bar.setAttribute("aria-label", `${b.name} (${b.display})`);
        bar.style.left = leftX + "px";

        const rawW = Math.max(10, (rightX - leftX));
        bar.style.width = rawW + "px";

        const c = timelineColors[b.colorIndex % timelineColors.length];
        bar.style.background = `linear-gradient(90deg, ${c}, rgba(255,255,255,.06))`;
        bars.appendChild(bar);

        // portrait card
        const midX = (leftX + rightX) / 2;

        const a = document.createElement("a");
        a.href = b.page;
        a.className = `battle ${b.lane === "above" ? "laneAbove" : "laneBelow"}`;
        a.style.left = midX + "px";

        // stack (swap order based on lane)
        const stack = document.createElement("div");
        stack.className = "stack";

        const avatarWrap = document.createElement("div");
        avatarWrap.className = "avatarWrap";
        avatarWrap.innerHTML = `<img src="${b.image}" alt="${b.name}">`;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `
          <div class="empName">${b.name}</div>
          <div class="empYears">${b.display}</div>
        `;

        if (b.lane === "above"){
          stack.appendChild(avatarWrap);
          stack.appendChild(meta);
        } else {
          stack.appendChild(meta);
          stack.appendChild(avatarWrap);
        }

        const connector = document.createElement("div");
        connector.className = "connector";

        a.appendChild(stack);
        a.appendChild(connector);

        canvas.appendChild(a);
      });

      // After layout paints, place lanes + connectors accurately
      requestAnimationFrame(() => {
        positionLanesSymmetrically();
        adjustConnectors();
        syncMiniWindow();
        updateDateReadout();
      });
    }

    function syncMiniWindow(){
      const total = viewport.scrollWidth;
      const view = viewport.clientWidth;
      const trackW = miniTrack.getBoundingClientRect().width;
      const ratio = trackW / total;

      const winW = Math.max(28, view * ratio);
      miniWindow.style.width = winW + "px";

      const left = viewport.scrollLeft * ratio;
      miniWindow.style.left = clamp(left, 0, trackW - winW) + "px";
    }

    function monthFloatToDate(mf){
      // mf is months since startDate
      const y0 = startDate.getUTCFullYear();
      const m0 = startDate.getUTCMonth();

      const whole = Math.floor(mf);
      const frac = mf - whole;

      const y = y0 + Math.floor((m0 + whole) / 12);
      const m = (m0 + whole) % 12;

      const monthStart = new Date(Date.UTC(y, m, 1));
      const nextMonth = new Date(Date.UTC(y, m+1, 1));
      const t = monthStart.getTime() + frac * (nextMonth.getTime() - monthStart.getTime());
      return new Date(t);
    }

    function fmtDate(dt){
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${months[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`;
    }

    function updateDateReadout(){
      const centerX = viewport.scrollLeft + viewport.clientWidth/2;
      const mf = centerX / pxPerMonth;
      const dt = monthFloatToDate(mf);
      yearReadout.textContent = "Date: " + fmtDate(dt);
    }

    // --- interactions ---
    zoom.addEventListener("input", () => {
      const prevCenter = viewport.scrollLeft + viewport.clientWidth/2;
      const prevMF = prevCenter / pxPerMonth;

      render();

      // restore same centered month after zoom
      const newCenter = xForMonth(prevMF);
      viewport.scrollLeft = clamp(newCenter - viewport.clientWidth/2, 0, viewport.scrollWidth);

      requestAnimationFrame(() => {
        syncMiniWindow();
        updateDateReadout();
      });
    });

    centerSelect.addEventListener("change", () => {
      if(centerSelect.value) centerOn(centerSelect.value);
      requestAnimationFrame(() => {
        syncMiniWindow();
        updateDateReadout();
      });
    });

    viewport.addEventListener("scroll", () => {
      syncMiniWindow();
      updateDateReadout();
    });

    // mini-map drag
    let dragging = false;
    let dragOffset = 0;

    miniWindow.addEventListener("mousedown", (e) => {
      dragging = true;
      dragOffset = e.clientX - miniWindow.getBoundingClientRect().left;
      e.preventDefault();
    });

    window.addEventListener("mouseup", () => dragging = false);

    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;

      const trackRect = miniTrack.getBoundingClientRect();
      const trackW = trackRect.width;
      const total = viewport.scrollWidth;
      const view = viewport.clientWidth;

      const ratio = trackW / total;
      const winW = Math.max(28, view * ratio);

      let newLeft = (e.clientX - trackRect.left) - dragOffset;
      newLeft = clamp(newLeft, 0, trackW - winW);

      miniWindow.style.left = newLeft + "px";
      viewport.scrollLeft = newLeft / ratio;

      syncMiniWindow();
      updateDateReadout();
    });

    miniTrack.addEventListener("mousedown", (e) => {
      if (e.target === miniWindow) return;

      const trackRect = miniTrack.getBoundingClientRect();
      const clickX = e.clientX - trackRect.left;

      const total = viewport.scrollWidth;
      const view = viewport.clientWidth;
      const trackW = trackRect.width;
      const ratio = trackW / total;

      const winW = Math.max(28, view * ratio);
      const targetLeft = clamp(clickX - winW/2, 0, trackW - winW);

      viewport.scrollLeft = targetLeft / ratio;
      syncMiniWindow();
      updateDateReadout();
    });

    window.addEventListener("resize", () => {
      requestAnimationFrame(() => {
        syncMiniWindow();
        updateDateReadout();
        positionLanesSymmetrically();
        adjustConnectors();
      });
    });

    // init
    populateDropdown();
    render();

    // initial center:
    requestAnimationFrame(() => {
      if(activeId && battles.some(b=>b.id===activeId)){
        centerSelect.value = activeId;
        centerOn(activeId);
      }else{
        // Center around late summer 1776 (busy cluster)
        const target = dateToMonthFloat("1776-09-01");
        viewport.scrollLeft = clamp(xForMonth(target) - viewport.clientWidth/2, 0, viewport.scrollWidth);
      }
      syncMiniWindow();
      updateDateReadout();
    });
  </script>
</body>
</html>
