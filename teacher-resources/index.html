<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Resources | Middle School History</title>

  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/teacher-resources/teacher-resources.css" />
</head>
<body>
  <div id="siteHeader" data-include="/partials/main-header.html"></div>

  <!-- Full-width Teacher Resources band (matches the Games landing-page pattern) -->
  <section class="teacher-band teacher-band--image"
           style="background-image: url('/assets/images/banners/teacher-resources-banner.jpg');"
           aria-label="Teacher Resources banner">
    <div class="teacher-band__bottom">
      <div class="teacher-band__inner">
        <h1 class="teacher-band__title">TEACHER RESOURCES</h1>
      </div>
    </div>
  </section>

  <main class="page teacher-page">
    <p class="teacher-intro">Free classroom utilities and teacher tools built for quick, practical use.</p>

    <section class="resource-grid" aria-label="Teacher resources">
      <a class="resource-card" href="/teacher-resources/flashcard-maker/">
        <div class="resource-card__visual" aria-hidden="true">
          <div class="mini-card mini-card--term">TERM</div>
          <div class="mini-card mini-card--definition">definition</div>
        </div>
        <div class="resource-card__body">
          <div class="resource-card__eyebrow">Printable Utility</div>
          <h2 class="resource-card__title">Flashcard Maker</h2>
          <p class="resource-card__desc">Paste or import terms and definitions, then create duplex-ready 3×5 flashcards four-up on letter-size paper.</p>
          <span class="resource-card__cta">Open Flashcard Maker →</span>
        </div>
      </a>
    </section>
  </main>

  <div id="siteFooter" data-include="/partials/footer.html"></div>
  <script src="/include.js"></script>
</body>
</html>
